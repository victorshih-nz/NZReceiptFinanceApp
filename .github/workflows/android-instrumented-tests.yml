name: Android Instrumented Tests

on:
  push:
    paths:
      - "app/src/main/java/com/example/nzreceiptapp/data/local/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/build.gradle"
      - ".github/workflows/android-instrumented-tests.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/example/nzreceiptapp/data/local/**"
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/build.gradle"
      - ".github/workflows/android-instrumented-tests.yml"

permissions:
  contents: read

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Java runtime
        run: java -version

      - name: Install Android 36.1 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1"

      - name: Run Room migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
