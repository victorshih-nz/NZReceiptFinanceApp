name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Java runtime
        run: java -version

      - name: Install Android 36.1 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1"

      - name: Run focused history tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests "com.example.nzreceiptapp.data.repository.ReceiptRepositoryImplTest"
          --tests "com.example.nzreceiptapp.data.local.dao.ReceiptDaoTest"
          --tests "com.example.nzreceiptapp.data.local.entity.DatabaseEntityV3Test"
          --tests "com.example.nzreceiptapp.domain.usecase.CheckDuplicateReceiptUseCaseTest"
          --stacktrace

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
