name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 36.1 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1"

      - name: Run focused history tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests "com.example.nzreceiptapp.data.repository.ReceiptRepositoryImplTest"
          --tests "com.example.nzreceiptapp.data.local.entity.DatabaseEntityV3Test"
          --tests "com.example.nzreceiptapp.domain.usecase.CheckDuplicateReceiptUseCaseTest"
          --stacktrace

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
